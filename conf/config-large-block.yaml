data:
  multi_root: true
  split: true
  wav: ['/home/sake/datasets/beatpulse_tracks', '/home/sake/datasets/pointune_tracks/seoul_pointune_839_tracks', '/home/sake/datasets/mixaudio_tracks/mixaudio_package_data_stems']
  samplerate: 44100
  segment: 11
  shift: 0.5
  channels: 2
  normalize: true
  metadata: ./metadata
  sources: ['high', 'mid', 'low', 'rhythm', 'melody']
  toothless: 'replace' # 'replace' or 'zero'
  replace_silence: true
  replace_silence_prob: 1.0

ema:
  epoch: [0.9, 0.95]
  batch: [0.9995, 0.9999]

model:
  sources: ['high', 'mid', 'low', 'rhythm', 'melody']
  audio_channels: 2
  # Main structure
  dims: [4, 64, 128, 256]
  # STFT
  nfft: 4096
  hop_size: 1024
  win_size: 4096
  normalized: True
  # SD/SU layer
  band_SR: [0.225, 0.372, 0.403]     
  band_stride: [1, 4, 16]             
  band_kernel: [3, 4, 16]                  
  # Convolution Module
  conv_depths: [3,2,1]
  compress: 4 
  conv_kernel: 3
  # Dual-path RNN
  num_dplayer: 6
  expand: 1

epochs: 130
batch_size: 3

optim:
  lr: 0.0002
  decay_rate: 0.98
  decay_step: 1000
  decay_unit: step # 'epoch' or 'step'
  momentum: 0.9
  beta2: 0.999
  optim: adam
  weight_decay: 0

seed: 42
save_every: 20000
log_every: 100
val_every: 20000

augment:
  shift_same: false
  remix:
    proba: 0.5
    group_size: 3
  scale:
    proba: 1
    min: 0.25
    max: 1.25
  flip: true

misc:
  num_workers: 10


audio_log:
  enable: True
  samples: ["000526_#33583 - Summer Love/__new_stems_outputs__", "000940_#43112 - Pyrex Lock Up (Stems)/__new_stems_outputs__", "000805_#41748 - Unsolved (Stems)/__new_stems_outputs__", "004050_#87195 - Antes A (Stems)/__new_stems_outputs__"]
  root: /home/sake/datasets/beatpulse_tracks
  segment: 11
  start: 30
  use_mp3: True
  mp3_bitrate: 192k